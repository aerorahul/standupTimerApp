name: Test Suite

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Debug - List files
      run: |
        echo "Repository contents:"
        ls -la
        echo "Config directory:"
        ls -la config/ || echo "config directory not found"
        echo "Package.json location:"
        ls -la config/package.json || echo "package.json not found in config/"
        echo "Tests directory:"
        ls -la tests/ || echo "tests directory not found"

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'config/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: ./config

    - name: Run tests
      run: npm test
      working-directory: ./config

    - name: Run tests with coverage
      run: npm run test:coverage
      working-directory: ./config

    - name: Upload coverage to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        file: ./config/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella